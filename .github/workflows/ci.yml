name: CI

# A-02 de la auditoría: el repo no tenía CI, ni un solo test, ni forma de que
# tsc/eslint/build corrieran solos antes de mergear. Esto es el mínimo que
# hubiera atajado varios de los otros hallazgos (A-17, A-18, drift de tipos).

on:
  push:
    branches: [main]
  pull_request:
  # Para volver a correr el deploy de migraciones a mano cuando un push a main
  # falló por algo transitorio, sin tener que empujar un commit vacío.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Cancelar la corrida vieja está bien en un PR y es peligroso en main: acá
  # abajo hay un job que aplica migraciones contra producción, y cancelarlo a
  # mitad de un `db push` deja la base en un estado que nadie eligió.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Valores dummy, NO secretos reales. Alcanzan para que las validaciones Zod
  # de src/lib/env.server.ts y src/lib/env.client.ts pasen (URLs bien
  # formadas, strings no vacíos): el build de Next evalúa esos módulos aunque
  # nunca llegue a abrir una conexión real a Supabase o Resend.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  SUPABASE_SECRET_KEY: ci-placeholder-secret-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  CRON_SECRET: ci-placeholder-cron-secret
  WHATSAPP_PROVIDER: link

jobs:
  build:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      # `npm ci` respeta package-lock.json al pie de la letra (A-18: es el
      # único lockfile trackeado, el gestor real de este repo es npm).
      - run: npm ci

      # `PageProps`, `LayoutProps` y `RouteContext` no se importan: son globales
      # que Next GENERA en `.next/types/`, y la doc de la version instalada lo
      # dice textual — "generated when running either next dev, next build or
      # next typegen". En una maquina de desarrollo ya existen porque corrio
      # `next dev`; en un checkout limpio no, y `tsc --noEmit` falla con 21
      # `TS2304: Cannot find name 'PageProps'` antes de llegar al build que los
      # habria creado. `typegen` hace solo esa parte, sin compilar la app.
      - run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint

      # Los tests que hablan con Postgres se saltean solos cuando el contenedor
      # no está: acá corren los unitarios (schemas, dinero, zonas horarias,
      # firma del webhook) y los de base van en el job de abajo, que sí levanta
      # el stack.
      - run: npm test

      - run: npm run build

  db-types:
    name: migraciones · drift de database.types.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` ya aplica las migraciones sobre una base nueva;
      # `db reset` además corre el seed, igual que scripts/db-reset.sh, así
      # que las migraciones se validan en las mismas condiciones que el flujo
      # de desarrollo local.
      - name: Levantar el stack local
        run: npx supabase start

      - name: Aplicar migraciones + seed (supabase db reset)
        run: npx supabase db reset

      # El drift entre database.types.ts y las migraciones es silencioso y
      # venenoso (A-18): un campo que cambia de tipo en una migración no avisa
      # en ningún lado hasta que algo explota en producción. Acá si difiere,
      # falla.
      - name: Regenerar tipos y compararlos contra lo commiteado
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.generated.ts
          if ! diff -q src/lib/supabase/database.types.ts /tmp/database.types.generated.ts > /dev/null; then
            echo "::error::src/lib/supabase/database.types.ts está desactualizado respecto de las migraciones."
            echo "Corré 'npm run db:types' localmente y commiteá el resultado. Diff:"
            diff src/lib/supabase/database.types.ts /tmp/database.types.generated.ts || true
            exit 1
          fi
          echo "database.types.ts coincide con el schema generado desde las migraciones."

      # Con el stack arriba, los tests de tests/db/ dejan de saltearse: acá es
      # donde se verifican de verdad los grants por columna, el trigger de
      # transiciones y las RPCs. Son las invariantes que la auditoría encontró
      # que vivían solo en TypeScript.
      - name: Tests de invariantes de Postgres
        run: npm test

      - name: Parar el stack
        if: always()
        run: npx supabase stop

  # ---------------------------------------------------------------------------
  # Hasta hoy las migraciones se aplicaban a mano desde una terminal: alguien se
  # acordaba de correr `supabase db push` después de mergear, o no. Es el mismo
  # agujero que A-02 encontró para tsc/eslint/build, un nivel más abajo — y acá
  # el olvido no rompe un build, rompe el runtime: el código nuevo sale a
  # producción por Vercel esperando una columna que en la base no existe.
  # ---------------------------------------------------------------------------
  deploy-migrations:
    name: migraciones · aplicar en producción
    # Solo en main, y solo después de que pasó todo lo demás. `db-types` es la
    # parte que importa: ya probó que ESTAS migraciones aplican sobre una base
    # vacía y que database.types.ts coincide. Si eso falla, no hay ninguna razón
    # para tocar producción.
    needs: [build, db-types]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Los deploys se serializan entre sí y NO se cancelan: dos `db push` en
    # paralelo compiten por la tabla de historial de migraciones del remoto. El
    # grupo es distinto del `concurrency` de arriba a propósito.
    concurrency:
      group: supabase-migrations-production
      cancel-in-progress: false

    env:
      # Personal access token de la cuenta (Supabase → Account → Access Tokens)
      # y la contraseña de la base del proyecto. Los dos son secretos de repo.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # El ref del proyecto NO es un secreto: viaja adentro de
      # NEXT_PUBLIC_SUPABASE_URL, o sea que ya está en el bundle que descarga
      # cualquier browser. Va hardcodeado por el mismo motivo que el dominio en
      # next.config.ts.
      SUPABASE_PROJECT_ID: xyjracoaufarsnhurhdc

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Linkear el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Deja escrito en el log QUÉ se va a aplicar, antes de aplicarlo. Es lo
      # único que queda para leer cuando algo se rompe seis horas después.
      - name: Previsualizar lo pendiente
        run: supabase db push --dry-run

      # `db push` aplica únicamente las migraciones que no figuran en la tabla
      # de historial del remoto, así que correrlo sobre una base al día no hace
      # nada. Lo que NO hace, y no queremos que haga, es tocar la config del
      # proyecto hosted: eso es `supabase config push`, y acá sería un
      # desastre — `supabase/config.toml` describe el stack LOCAL, con el
      # bloque `[auth.email.smtp]` comentado. Pushearlo apagaría el SMTP de
      # Resend en producción y con él el magic link, que es la única puerta a
      # /admin. El SMTP del proyecto hosted se configura en el dashboard.
      - name: Aplicar migraciones pendientes
        run: supabase db push

      # Verificar en vez de asumir: si local y remoto no quedaron en la misma
      # versión, se ve en el log de la corrida que lo causó y no tres días
      # después.
      - name: Confirmar que local y remoto quedaron iguales
        run: supabase migration list --linked
